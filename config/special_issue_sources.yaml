  # Rendered hub sources use a headless browser (Playwright, the "render" extra)
  # to load JS/anti-bot CFP index pages spanning many journals; findings are
  # filtered to communication relevance. NOTE: left INACTIVE because SAGE serves
  # an empty list to headless Chromium (bot mitigation) after initial access, so
  # results are unreliable. The mechanism is retained for non-protected hubs.
